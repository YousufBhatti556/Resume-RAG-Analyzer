<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login / Register - Resume RAG Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #020617;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 1.75rem;
        font-weight: 600;
        color: #e5e7eb;
      }
      .sub {
        margin: 0 0 28px 0;
        font-size: 0.95rem;
        color: #9ca3af;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #d1d5db;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        color: #e5e7eb;
        font-size: 0.95rem;
        margin-bottom: 20px;
        transition: border-color 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #10b981;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        margin-bottom: 12px;
      }
      .btn:hover:not(:disabled) {
        background: #059669;
      }
      .btn:disabled {
        background: #374151;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: #3b82f6;
      }
      .btn-secondary:hover:not(:disabled) {
        background: #2563eb;
      }
      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        text-align: center;
      }
      .status.success {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .status.error {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .status.info {
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .divider {
        text-align: center;
        margin: 24px 0;
        color: #6b7280;
        font-size: 0.85rem;
        position: relative;
      }
      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
      }
      .divider::before {
        left: 0;
      }
      .divider::after {
        right: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Resume RAG Analyzer</h1>
      <p class="sub">Login or create an account to continue</p>

      <form id="auth-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@email.com"
          required
          autocomplete="email"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
          minlength="8"
        />

        <button type="button" id="login-btn" class="btn btn-secondary">
          Login
        </button>
        <button type="button" id="signup-btn" class="btn">Sign Up</button>
      </form>

      <div id="status-text" class="status" style="display: none"></div>
    </div>

    <script>
      const API_BASE = "http://127.0.0.1:8000";
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");
      const signupBtn = document.getElementById("signup-btn");
      const statusText = document.getElementById("status-text");

      function showStatus(message, type = "info") {
        statusText.textContent = message;
        statusText.className = "status " + type;
        statusText.style.display = "block";
      }

      function hideStatus() {
        statusText.style.display = "none";
      }

      function setToken(token) {
        if (token) {
          localStorage.setItem("jwt_token", token);
          return true;
        }
        return false;
      }

      function redirectToAnalysis() {
        window.location.href = "index.html";
      }

      async function handleAuth(endpoint, actionName) {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          showStatus("Please enter both email and password", "error");
          return;
        }

        if (password.length < 8) {
          showStatus("Password must be at least 8 characters", "error");
          return;
        }

        loginBtn.disabled = true;
        signupBtn.disabled = true;
        hideStatus();

        try {
          const resp = await fetch(API_BASE + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await resp.json().catch(() => ({}));

          if (!resp.ok) {
            throw new Error(data.detail || `${actionName} failed`);
          }

          if (data.access_token) {
            if (setToken(data.access_token)) {
              showStatus(`${actionName} successful! Redirecting...`, "success");
              setTimeout(() => {
                redirectToAnalysis();
              }, 1000);
            } else {
              throw new Error("Failed to save token");
            }
          } else {
            throw new Error("No token received");
          }
        } catch (err) {
          let errorMsg = err.message || String(err);
          if (
            errorMsg.includes("Failed to fetch") ||
            errorMsg.includes("NetworkError")
          ) {
            errorMsg =
              "Backend connection failed. Make sure backend is running at http://127.0.0.1:8000";
          }
          showStatus(`${actionName} error: ${errorMsg}`, "error");
        } finally {
          loginBtn.disabled = false;
          signupBtn.disabled = false;
        }
      }

      loginBtn.addEventListener("click", () => {
        handleAuth("/auth/login", "Login");
      });

      signupBtn.addEventListener("click", () => {
        handleAuth("/auth/signup", "Signup");
      });

      // Check if already logged in
      if (localStorage.getItem("jwt_token")) {
        redirectToAnalysis();
      }

      // Allow Enter key to submit
      passwordInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          loginBtn.click();
        }
      });
    </script>
  </body>
</html>
